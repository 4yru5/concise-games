<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>0x Snake — concise games</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{color-scheme:dark;--bg:#000000;--panel:#0b0b0b;--ink:#f5f5f5;--green:#ffffff;--muted:#a0a0a0}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:var(--bg);color:var(--ink);font:16px ui-monospace,SFMono-Regular,Menlo,monospace;display:grid;place-items:center;padding:18px}
main{width:min(100%,680px)}header{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:14px}h1{font-size:clamp(24px,5vw,38px);letter-spacing:-2px;margin:0}h1 span{color:var(--green)}.tag{color:var(--muted);font-size:11px;letter-spacing:2px}.stats{display:flex;gap:8px}.stat{background:var(--panel);border:1px solid #383838;padding:10px 12px;min-width:82px}.stat small{display:block;color:var(--muted);font-size:10px}.stat strong{font-size:20px;color:var(--green)}
.frame{border:1px solid #666;background:#000000;padding:8px;box-shadow:0 16px 50px #0008}canvas{display:block;width:100%;height:auto;image-rendering:pixelated;touch-action:none}.controls{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;flex-wrap:wrap}.hint{color:var(--muted);font-size:12px;line-height:1.8}button{font:inherit;color:var(--ink);background:#111111;border:1px solid #555555;padding:10px 14px;cursor:pointer}button:hover,button:focus-visible{border-color:#ffffff;outline:none}button.primary{background:var(--green);color:#000000;border-color:#ffffff;font-weight:bold}.dpad{display:grid;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(2,38px);gap:4px}.dpad button{padding:0;font-size:17px}.dpad .up{grid-column:2}.dpad .left{grid-column:1;grid-row:2}.dpad .down{grid-column:2;grid-row:2}.dpad .right{grid-column:3;grid-row:2}footer{text-align:center;color:#888888;font-size:10px;letter-spacing:1px;margin-top:16px}
@media(min-width:560px){.dpad{display:none}}@media(max-width:420px){body{padding:12px}.stat{min-width:66px;padding:8px}.controls{align-items:flex-start}}
</style>
</head>
<body>
<main>
<header><div><div class="tag">A CONCISE ARCADE GAME</div><h1><span>0x</span> SNAKE</h1></div><div class="stats"><div class="stat"><small>SCORE</small><strong id="score">00</strong></div><div class="stat"><small>BEST</small><strong id="best">00</strong></div></div></header>
<div class="frame"><canvas id="game" width="600" height="400" aria-label="Snake game grid"></canvas></div>
<div class="controls"><div><button class="primary" id="start">START</button> <button id="pause">PAUSE</button><p class="hint">ARROWS / WASD · SPACE to pause · R to restart<br>Eat <b style="color:#ffffff">X</b>. Don't hit walls or yourself.</p></div><div class="dpad" aria-label="Touch controls"><button class="up" data-dir="up">↑</button><button class="left" data-dir="left">←</button><button class="down" data-dir="down">↓</button><button class="right" data-dir="right">→</button></div></div>
<footer>NO LIBRARIES · NO TRACKING · PLAY OFFLINE</footer>
</main>
<script>
(()=>{
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best'),startBtn=document.querySelector('#start'),pauseBtn=document.querySelector('#pause');
const COLS=30,ROWS=20,CELL=20,MAX=COLS*ROWS;let snake,food,dir,nextDir,score,best=0,timer=null,alive=false,paused=false,won=false;
try{best=Number(localStorage.getItem('oxsnake-best'))||0}catch{}bestEl.textContent=String(best).padStart(2,'0');
function reset(){clearInterval(timer);timer=null;snake=[{x:8,y:10},{x:7,y:10},{x:6,y:10}];dir=nextDir={x:1,y:0};score=0;alive=false;paused=false;won=false;placeFood();updateScore();draw('PRESS START');startBtn.textContent='START';pauseBtn.textContent='PAUSE'}
function placeFood(){const free=[];for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(!snake.some(p=>p.x===x&&p.y===y))free.push({x,y});food=free.length?free[Math.floor(Math.random()*free.length)]:null}
function updateScore(){scoreEl.textContent=String(score).padStart(2,'0');bestEl.textContent=String(best).padStart(2,'0')}
function start(){if(won||!snake)reset();if(alive&&!paused)return;alive=true;paused=false;startBtn.textContent='RESTART';pauseBtn.textContent='PAUSE';clearInterval(timer);timer=setInterval(tick,Math.max(65,145-score*1.2));draw()}
function togglePause(){if(!alive){start();return}paused=!paused;pauseBtn.textContent=paused?'RESUME':'PAUSE';draw(paused?'PAUSED':'')}
function setDir(d){const dirs={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};const n=dirs[d];if(n&&!(n.x===-dir.x&&n.y===-dir.y))nextDir=n;if(!alive&&!won)start()}
function tick(){if(!alive||paused)return;dir=nextDir;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y},eats=food&&head.x===food.x&&head.y===food.y;
if(head.x<0||head.y<0||head.x>=COLS||head.y>=ROWS||snake.slice(0,eats?snake.length:-1).some(p=>p.x===head.x&&p.y===head.y)){alive=false;clearInterval(timer);draw('GAME OVER · R TO RETRY');return}
snake.unshift(head);if(eats){score++;if(score>best){best=score;try{localStorage.setItem('oxsnake-best',best)}catch{}}placeFood();updateScore();if(!food){won=true;alive=false;clearInterval(timer);draw('GRID CLEARED · YOU WIN');return}clearInterval(timer);timer=setInterval(tick,Math.max(65,145-score*1.2))}else snake.pop();draw()}
function draw(message=''){ctx.fillStyle='#000000';ctx.fillRect(0,0,600,400);ctx.strokeStyle='#444444';ctx.lineWidth=1;for(let x=0;x<=COLS;x++){ctx.beginPath();ctx.moveTo(x*CELL+.5,0);ctx.lineTo(x*CELL+.5,400);ctx.stroke()}for(let y=0;y<=ROWS;y++){ctx.beginPath();ctx.moveTo(0,y*CELL+.5);ctx.lineTo(600,y*CELL+.5);ctx.stroke()}
if(food){ctx.fillStyle='#ffffff';ctx.font='bold 19px ui-monospace,monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('X',food.x*CELL+CELL/2,food.y*CELL+CELL/2)}
snake.forEach((p,i)=>{ctx.fillStyle='#ffffff';ctx.font='bold 18px ui-monospace,monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('0',p.x*CELL+CELL/2,p.y*CELL+CELL/2)});
if(message){ctx.fillStyle='rgba(0,0,0,0.88)';ctx.fillRect(0,0,600,400);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#ffffff';ctx.font='bold 22px ui-monospace,monospace';ctx.fillText(message,300,190);ctx.fillStyle='#dddddd';ctx.font='12px ui-monospace,monospace';ctx.fillText(won?'ALL CELLS EATEN':message.startsWith('GAME')?'PRESS R OR RESTART':'EAT X · FILL THE GRID',300,222)}}
document.addEventListener('keydown',e=>{const map={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'};if(map[e.key]){e.preventDefault();setDir(map[e.key])}else if(e.code==='Space'){e.preventDefault();togglePause()}else if(e.key.toLowerCase()==='r')reset()});
document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>setDir(b.dataset.dir)));startBtn.addEventListener('click',()=>{reset();start()});pauseBtn.addEventListener('click',togglePause);
let touchX=0,touchY=0;canvas.addEventListener('touchstart',e=>{touchX=e.changedTouches[0].clientX;touchY=e.changedTouches[0].clientY},{passive:true});canvas.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-touchX,dy=e.changedTouches[0].clientY-touchY;if(Math.max(Math.abs(dx),Math.abs(dy))>20)setDir(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))},{passive:true});
reset();if('serviceWorker'in navigator&&location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script>
</body>
</html>
